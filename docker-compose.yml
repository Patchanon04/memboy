name: memboy   # compose project name (containers memboy-*, volumes memboy_*) regardless of the folder name
services:
  app:
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1   # resolver returns AAAA first; v6 is blackholed here -> fail fast, fall back to v4
    restart: unless-stopped   # come back on their own after Docker Desktop restarts/updates
    build: .
    dns: [1.1.1.1, 8.8.8.8]
    ports: ["127.0.0.1:8080:8080"]   # loopback only: the tunnel reaches the app on the compose network, the LAN must not
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://memboy:memboy@db:5432/memboy
      REDIS_URL: redis://redis:6379
      TZ: Asia/Bangkok
    volumes:
      - ./data:/data
      - ./app:/srv/app          # dev hot-reload; remove for prod image
      - ./eval:/srv/eval        # sample receipts + eval logs/report output
      - ./tests:/srv/tests
      - ./scripts:/srv/scripts
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload --app-dir /srv

  worker:
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1   # resolver returns AAAA first; v6 is blackholed here -> fail fast, fall back to v4
    restart: unless-stopped   # come back on their own after Docker Desktop restarts/updates
    build: .
    dns: [1.1.1.1, 8.8.8.8]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://memboy:memboy@db:5432/memboy
      REDIS_URL: redis://redis:6379
      TZ: Asia/Bangkok
    volumes:
      - ./data:/data
      - ./app:/srv/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: arq app.worker.WorkerSettings

  redis:
    restart: unless-stopped   # come back on their own after Docker Desktop restarts/updates
    image: redis:7-alpine
    command: redis-server --appendonly yes   # AOF: queued jobs survive redis restart
    volumes: ["redisdata:/data"]

  db:
    restart: unless-stopped   # come back on their own after Docker Desktop restarts/updates
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: memboy
      POSTGRES_PASSWORD: memboy   # ponytail: dev creds, compose-internal only
      POSTGRES_DB: memboy
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memboy"]
      interval: 2s
      timeout: 3s
      retries: 15

  cloudflared:
    # named tunnel from inside the compose network: origin is http://app:8080, so Docker Desktop's flaky host
    # port-forward (127.0.0.1:8080 dying while containers stay Up) is out of the path. Token = TUNNEL_TOKEN in .env.
    build: { context: ., dockerfile: Dockerfile.cloudflared }
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token ${TUNNEL_TOKEN}   # UDP/QUIC doesn't leave the Docker VM here
    depends_on: [app]
    networks: [default, retouch]   # also serves the sibling project's routes (retouch/healthcoach.ohmpire.dev)

volumes:
  pgdata:
  redisdata:

networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: 1280   # Docker Desktop + VPN/WARP: large POST bodies stall at default MTU
  retouch:
    external: true
    name: auto-retouch_default

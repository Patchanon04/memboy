services:
  app:
    build: .
    ports: ["8080:8080"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pbook:pbook@db:5432/pbook
      REDIS_URL: redis://redis:6379
      TZ: Asia/Bangkok
    volumes:
      - ./data:/data
      - ./app:/srv/app          # dev hot-reload; remove for prod image
      - ./eval:/srv/eval:ro     # sample receipts for chat_cli testing
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload --app-dir /srv

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://pbook:pbook@db:5432/pbook
      REDIS_URL: redis://redis:6379
      TZ: Asia/Bangkok
    volumes:
      - ./data:/data
      - ./app:/srv/app
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: arq app.worker.WorkerSettings

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes   # AOF: queued jobs survive redis restart
    volumes: ["redisdata:/data"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pbook
      POSTGRES_PASSWORD: pbook   # ponytail: dev creds, compose-internal only
      POSTGRES_DB: pbook
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pbook"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
  redisdata:

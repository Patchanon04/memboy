<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PBook — ทดสอบผู้ช่วยใบเสร็จ</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif; color: #111; background: #fff;
         display: flex; flex-direction: column; height: 100dvh; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #eee; }
  header b { font-size: 16px; }
  header .who { margin-left: auto; font-size: 13px; color: #777; }
  header button { font: inherit; font-size: 13px; border: 1px solid #ddd; background: #fff; border-radius: 8px; padding: 5px 10px; cursor: pointer; }
  #log { flex: 1; overflow-y: auto; padding: 0 16px; }
  .col { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; padding: 18px 0 24px; }
  .msg { line-height: 1.6; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #f2f4f7; border-radius: 20px; padding: 10px 16px; max-width: 78%; }
  .bot { display: flex; gap: 12px; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: #1f3a5f; color: #fff; display: grid; place-items: center; font-size: 13px; flex-shrink: 0; }
  .bot .body { flex: 1; min-width: 0; }
  .msg img { display: block; max-width: 280px; border-radius: 12px; margin-bottom: 8px; }
  .files a { display: inline-block; margin-top: 8px; padding: 8px 14px; border: 1px solid #d6d6d6; border-radius: 10px;
             text-decoration: none; color: #1f3a5f; font-size: 14px; }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .quick button { font: inherit; font-size: 14px; border: 1px solid #1f3a5f; color: #1f3a5f; background: #fff;
                  border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .quick button:hover { background: #eef3f9; }
  .think { color: #888; }
  .think:after { content: "▍"; animation: b 1s steps(2) infinite; }
  @keyframes b { 50% { opacity: 0; } }
  footer { padding: 0 16px 14px; }
  #box { max-width: 760px; margin: 0 auto; border: 1px solid #ddd; border-radius: 24px; padding: 8px 8px 8px 14px;
         display: flex; align-items: flex-end; gap: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  textarea { flex: 1; border: 0; outline: 0; resize: none; font: inherit; font-size: 16px; max-height: 160px; padding: 8px 0; }
  .ib { width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer; font-size: 17px; flex-shrink: 0; }
  #attach { background: none; } #attach:hover { background: #f1f1f1; }
  #send { background: #111; color: #fff; } #send:disabled { background: #ccc; }
  #preview { max-height: 54px; border-radius: 8px; display: none; }
  #hint { text-align: center; font-size: 12px; color: #999; margin-top: 8px; }
  #empty { text-align: center; color: #555; margin-top: 22vh; }
  #empty h2 { font-size: 22px; margin: 0 0 8px; }
  #empty p { margin: 4px 0; font-size: 14px; color: #888; }
</style>
</head>
<body>
<header>
  <b>PBook</b><span style="font-size:13px;color:#888">ทดสอบผู้ช่วยใบเสร็จ (agent เดียวกับ LINE)</span>
  <span class="who" id="who"></span>
  <button id="logout">ออก</button>
</header>
<div id="log"><div class="col" id="col">
  <div id="empty"><h2>ส่งรูปใบเสร็จมาได้เลย 📷</h2>
    <p>หรือพิมพ์: "เดือนนี้ใช้ไปเท่าไหร่" · "ขอรายงาน PDF" · "สร้างโปรไฟล์ทริปเชียงใหม่"</p></div>
</div></div>
<footer>
  <div id="box">
    <input type="file" id="file" accept="image/*,application/pdf" hidden>
    <button class="ib" id="attach" title="แนบรูป/PDF">📎</button>
    <img id="preview">
    <textarea id="text" rows="1" placeholder="พิมพ์ข้อความ…"></textarea>
    <button class="ib" id="send" title="ส่ง">↑</button>
  </div>
  <div id="hint">ข้อมูลแยกตามชื่อผู้ใช้ที่ล็อกอิน · บิลจะถูกบันทึกเมื่อยืนยันเท่านั้น</div>
</footer>
<script>
const $ = id => document.getElementById(id);
let image = null, busy = false;
fetch('/api/me').then(r => r.json()).then(j => $('who').textContent = j.user ? '@' + j.user : '');
$('logout').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.href = '/login'; };

function bubble(cls) {
  $('empty')?.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  if (cls === 'bot') d.innerHTML = '<div class="avatar">P</div><div class="body"></div>';
  $('col').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
  return cls === 'bot' ? d.querySelector('.body') : d;
}

$('attach').onclick = () => $('file').click();
$('file').onchange = () => {
  const f = $('file').files[0];
  if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    if (f.type === 'application/pdf') { image = fr.result; $('preview').style.display = 'none'; $('text').placeholder = '📄 ' + f.name; return; }
    const img = new Image();
    img.onload = () => {   // shrink client-side too: keeps the upload small on mobile data
      const s = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      image = c.toDataURL('image/jpeg', 0.85);
      $('preview').src = image; $('preview').style.display = 'block';
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(f);
};
$('text').oninput = () => { const t = $('text'); t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; };
$('text').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
$('send').onclick = () => send();

async function send(preset) {
  if (busy) return;
  const t = preset ?? $('text').value.trim();
  if (!t && !image) return;
  const u = bubble('user');
  if (image && !image.startsWith('data:application/pdf')) { const i = document.createElement('img'); i.src = image; u.appendChild(i); }
  else if (image) u.appendChild(document.createTextNode('📄 ไฟล์ PDF\n'));
  u.appendChild(document.createTextNode(t));
  const payload = { text: t, image };
  $('text').value = ''; $('text').style.height = 'auto'; $('text').placeholder = 'พิมพ์ข้อความ…';
  image = null; $('preview').style.display = 'none'; $('file').value = '';
  busy = true; $('send').disabled = true;
  const body = bubble('bot');
  body.innerHTML = '<span class="think">กำลังคิด</span>';
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (r.status === 401) return location.href = '/login';
    const j = await r.json();
    body.textContent = j.reply || '(ไม่มีข้อความตอบ)';
    for (const src of j.images || []) { const i = document.createElement('img'); i.src = src; body.prepend(i); }
    if (j.files?.length) {
      const box = document.createElement('div'); box.className = 'files';
      for (const f of j.files) { const a = document.createElement('a'); a.href = f.url; a.target = '_blank'; a.textContent = '📄 เปิดไฟล์ ' + f.kind; box.appendChild(a); }
      body.appendChild(box);
    }
    if (j.quick?.length) {
      const box = document.createElement('div'); box.className = 'quick';
      for (const q of j.quick) { const b = document.createElement('button'); b.textContent = q; b.onclick = () => { box.remove(); send(q); }; box.appendChild(b); }
      body.appendChild(box);
    }
  } catch (e) { body.textContent = 'ERROR: ' + e; }
  busy = false; $('send').disabled = false; $('log').scrollTop = $('log').scrollHeight; $('text').focus();
}
</script>
</body>
</html>

<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MemBoy Dashboard</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f5f7fa; color: #1f2937; }
  header { background: #1f3a5f; color: #fff; padding: 16px; }
  header h1 { margin: 0; font-size: 18px; } header .sub { font-size: 12px; opacity: .8; }
  main { padding: 12px; display: grid; gap: 12px; }
  .card { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .big { font-size: 32px; font-weight: 700; color: #1f3a5f; }
  .row { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
  .muted { color: #6b7280; font-size: 12px; }
  select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid #d1d5db; }
  #err { color: #b91c1c; }
</style>
</head>
<body>
<header><h1>📊 MemBoy Dashboard</h1><div class="sub" id="who">กำลังโหลด…</div></header>
<main>
  <div class="card"><select id="months"><option value="1">เดือนนี้</option><option value="3">3 เดือน</option><option value="6" selected>6 เดือน</option><option value="12">12 เดือน</option></select>
    <span class="muted" id="range"></span></div>
  <div class="card"><div class="muted">รวมทั้งหมด</div><div class="big" id="total">–</div><div class="muted" id="count"></div></div>
  <div class="card"><canvas id="cat" height="220"></canvas></div>
  <div class="card"><canvas id="month" height="200"></canvas></div>
  <div class="card"><div class="muted">ยังไม่ได้เบิก</div><div id="pending"></div></div>
  <div id="err"></div>
</main>
<script>
const qs = new URLSearchParams(location.search);
let charts = {};
async function load() {
  let auth = {};
  if (qs.get('uid')) auth = { uid: qs.get('uid') };                       // dev mode (server allows only when LIFF_ID unset)
  else if (window.liff && qs.get('liff') !== '0') {
    await liff.init({ liffId: qs.get('liffId') || document.body.dataset.liff });
    if (!liff.isLoggedIn()) return liff.login();
    auth = { id_token: liff.getIDToken() };
  }
  const months = document.getElementById('months').value;
  const r = await fetch('/api/dashboard?' + new URLSearchParams({ ...auth, months }));
  if (!r.ok) { document.getElementById('err').textContent = 'โหลดข้อมูลไม่ได้ (' + r.status + ')'; return; }
  const d = await r.json();
  document.getElementById('who').textContent = 'โปรไฟล์: ' + d.profiles.join(', ');
  document.getElementById('range').textContent = d.from + ' – ' + d.to;
  document.getElementById('total').textContent = '฿' + d.total.toLocaleString('th-TH', { minimumFractionDigits: 2 });
  document.getElementById('count').textContent = d.count + ' รายการ · VAT ' + d.vat.toLocaleString('th-TH', { minimumFractionDigits: 2 });
  document.getElementById('pending').innerHTML = d.pending.map(p => `<div class="row"><span>${p.date} ${p.vendor}</span><b>${p.total.toLocaleString('th-TH')}</b></div>`).join('') || '<span class="muted">ไม่มี</span>';
  for (const k in charts) charts[k].destroy();
  charts.cat = new Chart(document.getElementById('cat'), { type: 'doughnut', data: { labels: Object.keys(d.by_category), datasets: [{ data: Object.values(d.by_category), backgroundColor: ['#4a7ebb','#f59e0b','#10b981','#ef4444','#8b5cf6','#14b8a6','#6b7280'] }] }, options: { plugins: { title: { display: true, text: 'แยกตามหมวด' } } } });
  charts.month = new Chart(document.getElementById('month'), { type: 'bar', data: { labels: Object.keys(d.months), datasets: [{ label: 'บาท', data: Object.values(d.months), backgroundColor: '#4a7ebb' }] }, options: { plugins: { title: { display: true, text: 'ยอดรายเดือน' }, legend: { display: false } } } });
}
document.getElementById('months').onchange = load;
load().catch(e => document.getElementById('err').textContent = String(e));
</script>
</body>
</html>
